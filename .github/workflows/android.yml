name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to the Flutter release this project is built with locally.
      # Newer releases reject its Gradle 8.12 / AGP 8.7.3 setup; bump this
      # together with android/settings.gradle.kts and the Gradle wrapper.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      # The release key lives only in repository secrets. Pull requests and
      # forks don't get secrets, so their builds use the debug key instead.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with the debug key"
          fi

      # The run number becomes the version code, so every build counts as an
      # update to the previous one.
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk budget-checklist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budget-checklist-apk
          path: budget-checklist.apk
          retention-days: 30

      # Every push to main becomes a release, so the README's
      # releases/latest/download link always points at the newest APK.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: APK built from ${{ github.sha }}.
          files: budget-checklist.apk
          make_latest: true
